/* =========================================================
AUTH SUBMIT
========================================================= */

async function submitAuth(){

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

const fullName =
document.getElementById("fullName").value.trim();

const message =
document.getElementById("authMessage");

message.innerText = "";

if(!email || !password){

message.innerText =
"Please enter your email and password.";

return;

}

try{

if(signupMode){

if(!fullName){

message.innerText =
"Please enter your full name.";

return;

}

const {data,error} =
await supabaseClient.auth.signUp({

email,
password,

options:{
data:{
full_name:fullName,
role:selectedRole
}
}

});

if(error) throw error;

if(!data.user){

throw new Error(
"Account creation failed."
);

}

const {error:profileError} =
await supabaseClient
.from("profiles")
.upsert({

id:data.user.id,
full_name:fullName,
email:email,
role:selectedRole

},{
onConflict:"id"
});

if(profileError){

console.error(
"profile error",
profileError
);

}

if(selectedRole === "provider"){

const {error:providerError} =
await supabaseClient
.from("providers")
.upsert({

user_id:data.user.id,

business_name:fullName,

description:
"Phil Connect service provider",

verification_status:"pending",

is_online:false,

is_available:false,

rating:0,

total_jobs:0

},{
onConflict:"user_id"
});

if(providerError){

console.error(
"provider error",
providerError
);

}

}

message.innerText =
"Account created successfully. Please check your email if verification is required, then login.";

signupMode = false;

document.getElementById("nameField")
.classList.add("hidden");

document.getElementById("submitButton")
.innerText = "Login";

document.getElementById("authSubtitle")
.innerText = "Login to continue.";

document.getElementById("switchText")
.innerText = "Sign up";

return;

}


const {data,error} =
await supabaseClient.auth.signInWithPassword({

email,
password

});

if(error) throw error;

currentUser = data.user;

closeAuth();

await showDashboard(data.user.id);

}catch(error){

console.error(error);

message.innerText =
error.message ||
"Something went wrong.";

}

}


/* =========================================================
DASHBOARD
========================================================= */

async function showDashboard(userId){

const {data:profile,error} =
await supabaseClient
.from("profiles")
.select("*")
.eq("id",userId)
.maybeSingle();

if(error){

console.error(error);

alert(
"Could not load your profile."
);

return;

}

if(!profile){

alert(
"Your profile was not found."
);

return;

}

document.getElementById("home")
.classList.add("hidden");

document.getElementById("customerDashboard")
.classList.remove("active");

document.getElementById("providerDashboard")
.classList.remove("active");

document.getElementById("adminDashboard")
.classList.remove("active");


if(profile.role === "admin"){

document.getElementById("adminDashboard")
.classList.add("active");

await loadAdminDashboard();

startAutoRefresh("admin");

}

else if(profile.role === "provider"){

document.getElementById("providerDashboard")
.classList.add("active");

await loadProviderDashboard(userId);

startAutoRefresh("provider");

}

else{

document.getElementById("customerDashboard")
.classList.add("active");

await loadCustomerDashboard();

startAutoRefresh("customer");

}

}


/* =========================================================
AUTO REFRESH
========================================================= */

function startAutoRefresh(role){

stopAutoRefresh();

refreshTimer =
setInterval(async()=>{

try{

if(!currentUser) return;

if(role === "customer"){

await loadMyRequests();

}

if(role === "provider"){

await loadAvailableJobs();

await loadProviderJobs();

await loadProviderVerification();

}

if(role === "admin"){

if(!currentReviewId){

await loadAdminDashboard();

}

}

}catch(error){

console.error(
"AUTO REFRESH ERROR",
error
);

}

},5000);

}


function stopAutoRefresh(){

if(refreshTimer){

clearInterval(refreshTimer);

refreshTimer = null;

}

}

.eq("customer_id",user.id)
.order("created_at",{ascending:false})
.limit(1);

async function acceptJob(jobId){

const {
data:{user}
} =
await supabaseClient.auth.getUser();

if(!user) return;

const {data:provider,error} =
await supabaseClient
.from("providers")
.select(
"id,verification_status,is_online,is_available"
)
.eq("user_id",user.id)
.single();

if(error){

alert(error.message);

return;

}

if(provider.verification_status !== "approved"){

alert(
"Your provider account is not approved."
);

return;

}

const amount =
prompt(
"Enter the amount you will charge for this job:"
);

if(amount === null) return;

const finalAmount =
Number(amount);

if(!finalAmount || finalAmount <= 0){

alert(
"Enter a valid amount."
);

return;

}

const {data,error:updateError} =
await supabaseClient
.from("service_requests")
.update({

provider_id:provider.id,

provider_amount:finalAmount,

status:"accepted",

accepted_at:
new Date().toISOString()

})
.eq("id",jobId)
.is("provider_id",null)
.eq("status","pending")
.select()
.single();

if(updateError){

alert(updateError.message);

return;

}

if(!data){

alert(
"This job has already been accepted."
);

return;

}

alert(
"Job accepted successfully."
);

await loadAvailableJobs();

await loadProviderJobs();

}

async function changeJobStatus(jobId,status){

const {
data:{user}
} =
await supabaseClient.auth.getUser();

if(!user) return;

const {data:provider} =
await supabaseClient
.from("providers")
.select("id")
.eq("user_id",user.id)
.single();

if(!provider){

alert(
"Provider profile not found."
);

return;

}

const updates = {
status:status
};

if(status === "completed"){

updates.completed_at =
new Date().toISOString();

}

const {error} =
await supabaseClient
.from("service_requests")
.update(updates)
.eq("id",jobId)
.eq("provider_id",provider.id);

if(error){

alert(error.message);

return;

}

await loadProviderJobs();

}


/* =========================================================
PHOTO ID UPLOAD
========================================================= */

async function uploadPhotoID(userId,providerId){

const fileInput =
document.getElementById("verifyIDPhoto");

if(
!fileInput ||
!fileInput.files ||
!fileInput.files.length
){

return null;

}

const file =
fileInput.files[0];

const maxSize =
10 * 1024 * 1024;

if(file.size > maxSize){

throw new Error(
"Photo ID must be 10MB or less."
);

}

const extension =
file.name.split(".").pop();

const fileName =
`${userId}/${providerId}_${Date.now()}.${extension}`;

const {error} =
await supabaseClient.storage
.from("provider-documents")
.upload(
fileName,
file,
{
upsert:true
}
);

if(error){

throw new Error(
"Photo ID upload failed: " +
error.message
);

}

return fileName;

}

async function approveVerification(
verificationId
){

if(!currentUser){

alert(
"Admin session not found."
);

return;

}

const notesElement =
document.getElementById(
"adminNotes_" + verificationId
);

const notes =
notesElement
?
notesElement.value.trim()
:
"";


const {
data:verification,
error
} =
await supabaseClient
.from("provider_verifications")
.select(
"provider_id,status"
)
.eq("id",verificationId)
.single();

if(error){

alert(error.message);

return;

}

if(!confirm(
"Are you sure you want to APPROVE this provider?"
)){

return;

}


const {
error:updateError
} =
await supabaseClient
.from("provider_verifications")
.update({

status:"approved",

reviewed_at:
new Date().toISOString(),

reviewed_by:
currentUser.id,

admin_notes:
notes || null,

rejection_reason:null

})
.eq("id",verificationId);

if(updateError){

alert(
"Verification update failed: " +
updateError.message
);

return;

}


/* PROVIDER */

const {
error:providerError
} =
await supabaseClient
.from("providers")
.update({

verification_status:"approved",

is_available:true,

is_online:false

})
.eq("id",verification.provider_id);

if(providerError){

alert(
"Provider status update failed: " +
providerError.message
);

return;

}


/* GUARANTORS */

await supabaseClient
.from("provider_guarantors")
.update({

verification_status:"approved",

admin_notes:
notes || null

})
.eq(
"verification_id",
verificationId
);


/* EVENT */

await supabaseClient
.from("provider_verification_events")
.insert({

verification_id:
verificationId,

actor_id:
currentUser.id,

action:"approved",

old_status:
verification.status,

new_status:"approved",

notes:
notes || null

});


alert(
"✅ Provider approved successfully."
);

currentReviewId =
null;

await loadAdminStats();

backToAdminApplications();

}

REJECT

);

const notesElement =
document.getElementById(
"adminNotes_" + verificationId
);

const notes =
notesElement
?
notesElement.value.trim()
:
"";


const {
data:verification,
error
} =
await supabaseClient
.from("provider_verifications")
.select(
"provider_id,status"
)
.eq("id",verificationId)
.single();

if(error){

alert(error.message);

return;

}

if(!confirm(

)){

return;

}


const {

} =
await supabaseClient
.from("provider_verifications")
.update({

status:"rejected",

reviewed_at:
new Date().toISOString(),

reviewed_by:
currentUser.id,

})
.eq("id",verificationId);

/* PROVIDER */

const {
error:providerError
} =
await supabaseClient
.from("providers")
.update({

verification_status:"rejected",

is_available:false

})
.eq(
"id",
verification.provider_id
);

if(providerError){

alert(
"Provider status update failed: " +
providerError.message
);

return;

}


/* GUARANTORS */

await supabaseClient
.from("provider_guarantors")
.update({

verification_status:"rejected",

admin_notes:reason

})
.eq(
"verification_id",
verificationId
);


/* EVENT */

await supabaseClient
.from("provider_verification_events")
.insert({

verification_id:
verificationId,

actor_id:
currentUser.id,

action:"rejected",

old_status:
verification.status,

new_status:"rejected",

notes:reason

});


alert(
"❌ Provider rejected. They can now correct the information and resubmit."
);

currentReviewId =
null;

await loadAdminStats();

backToAdminApplications();

}

/* =========================================================
ESCAPE HTML
========================================================= */

function escapeHTML(value){

if(
value === null ||
value === undefined
){

return "";

}

return String(value)

.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
